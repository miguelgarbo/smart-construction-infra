- name: Carregar hosts do Terraform
  hosts: localhost
  gather_facts: false

  vars:
    terraform_outputs: "{{ lookup('file', 'terraform_outputs.json') | from_json }}"

  tasks:
    - name: Adicionar aplicação
      ansible.builtin.add_host:
        name: app1
        groups: app
        ansible_host: "{{ terraform_outputs.app_public_ip.value }}"
        ansible_port: 22
        ansible_user: awsuser
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519

    - name: Adicionar banco
      ansible.builtin.add_host:
        name: db1
        groups: db
        ansible_host: "{{ terraform_outputs.db_public_ip.value }}"
        ansible_port: 22
        ansible_user: awsuser
        ansible_ssh_private_key_file: ~/.ssh/id_ed25519