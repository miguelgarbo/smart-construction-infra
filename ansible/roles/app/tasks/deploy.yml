- name: Pasta de configuração do deploy
  ansible.builtin.file:
    path: "{{ project_dir }}/deploy"
    state: directory
    mode: "0755"

- name: Gera configuração do NGINX
  ansible.builtin.template:
    src: nginx.conf.j2
    dest: "{{ project_dir }}/deploy/nginx.conf"
    mode: "0644"

- name: Gera override do compose
  ansible.builtin.template:
    src: compose.app.yaml.j2
    dest: "{{ project_dir }}/compose.app.yaml"
    mode: "0644"

- name: Aguarda resposta do PostgreSQL no db1
  ansible.builtin.wait_for:
    host: "{{ db_host_ip }}"
    port: 5432
    timeout: 180

- name: Sobe a aplicação
  community.docker.docker_compose_v2:
    project_src: "{{ project_dir }}"
    files:
      - compose.yaml
      - compose.app.yaml
    state: present
    build: always
    pull: missing
    remove_orphans: true
    wait: true
    wait_timeout: "{{ compose_wait_timeout | int }}"

- name: Testa o NGINX
  ansible.builtin.uri:
    url: "http://127.0.0.1:{{ http_port }}/healthz"
    status_code: 200
  register: health
  retries: 10
  delay: 6
  until: health.status == 200

- name: Testa a página pública
  ansible.builtin.uri:
    url: "{{ public_url }}/"
    status_code: 200
  register: home
  retries: 10
  delay: 6
  until: home.status == 200

- name: Retorna URL funcionando
  ansible.builtin.debug:
    msg: "Funcionando: {{ public_url }}/"

- name: Cria usuário administrador inicial
  ansible.builtin.expect:
    command: >-
      docker compose
      -f compose.yaml
      -f compose.app.yaml
      exec -T api
      python -m app.auth.cli create
      --login admin
      --nome "Administrador do laboratório"
    chdir: "{{ project_dir }}"
    responses:
      'Senha \(12 a 256 caracteres\):': "{{ admin_password }}"
      "Confirme a senha:": "{{ admin_password }}"
    timeout: 60
  register: admin_creation
  failed_when:
    - admin_creation.rc != 0
    - "'Administrador já existe' not in admin_creation.stdout"
  no_log: true

- name: Verifica profissões disponíveis
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - api
      - python
      - -m
      - app.profissoes.cli
    chdir: "{{ project_dir }}"
  changed_when: false

- name: Aplica profissões utilizando administrador
  ansible.builtin.command:
    argv:
      - docker
      - compose
      - exec
      - -T
      - api
      - python
      - -m
      - app.profissoes.cli
      - --apply
      - --admin-login
      - admin
    chdir: "{{ project_dir }}"
