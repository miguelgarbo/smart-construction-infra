---
# Sobe a aplicação. Também serve para redeploy depois de mudar o código.

- name: Atualiza o código
  ansible.builtin.git:
    repo: "{{ repo_url }}"
    dest: "{{ app_dir }}"
    version: main
    force: true

- name: Copia o compose da app (o git force sobrescreve o do repositório)
  ansible.builtin.copy:
    src: compose-web.yml
    dest: "{{ app_dir }}/compose-web.yml"

- name: Build e up
  ansible.builtin.command: docker compose -f compose-web.yml up -d --build --wait --wait-timeout 300
  args:
    chdir: "{{ app_dir }}"

- name: Aplica seed/configuração de profissões vinculada ao admin
  ansible.builtin.shell: |
    set -o pipefail
    docker compose -f compose-web.yml exec -T api \
      python -m app.profissoes.cli --apply --admin-login admin
  args:
    chdir: /opt/smart-construction-web/smart-construction
    executable: /bin/bash
  no_log: true
  register: profissoes_apply_result
  changed_when: "'no changes' not in (profissoes_apply_result.stdout ~ profissoes_apply_result.stderr) | lower"
  failed_when:
    - profissoes_apply_result.rc != 0
    - "'already exists' not in (profissoes_apply_result.stdout ~ profissoes_apply_result.stderr) | lower"

- name: Lista/valida profissões cadastradas no backend
  ansible.builtin.shell: |
    set -o pipefail
    docker compose -f compose-web.yml exec -T api \
      python -m app.profissoes.cli
  args:
    chdir: /opt/smart-construction-web/smart-construction
    executable: /bin/bash
  register: profissoes_list_result
  changed_when: false
