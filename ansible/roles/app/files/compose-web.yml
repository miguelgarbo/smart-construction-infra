name: smart-construction-front

services:
  storage:
    image: chrislusf/seaweedfs:4.48
    entrypoint: ["/bin/sh", "/opt/storage/start.sh"]
    environment:
      S3_BUCKET: ${ASSETS_BUCKET:-smart-assets}
    volumes:
      - storage-data:/data
      - ./docker/storage:/opt/storage:ro
    secrets:
      - storage_access_key
      - storage_secret_key
      - storage_admin_password
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "-q",
          "-O",
          "/dev/null",
          "http://127.0.0.1:9333/cluster/status",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - default
      - smart-construction-net
    init: true
    restart: unless-stopped

  storage-init:
    image: amazon/aws-cli:2.38.3
    entrypoint: ["/bin/sh", "/opt/storage/init.sh"]
    environment:
      S3_BUCKET: ${ASSETS_BUCKET:-smart-assets}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    volumes:
      - ./docker/storage:/opt/storage:ro
      - ./public/images:/seed:ro
    secrets:
      - storage_access_key
      - storage_secret_key
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - default
      - smart-construction-net
    restart: "no"

  storage-setup:
    image: node:24-bookworm-slim
    profiles: ["tools"]
    entrypoint: ["node", "/opt/storage/setup.mjs"]
    volumes:
      - ./docker/storage:/opt/storage:ro
      - ${SMART_SECRETS_DIR:-./.secrets}/storage:/secrets
    networks:
      - default
    restart: "no"

  storage-cli:
    image: amazon/aws-cli:2.38.3
    profiles: ["tools"]
    entrypoint: ["/bin/sh", "/opt/storage/cli.sh"]
    environment:
      S3_BUCKET: ${ASSETS_BUCKET:-smart-assets}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    volumes:
      - ./docker/storage:/opt/storage:ro
      - ./backups/storage:/backup
    secrets:
      - storage_access_key
      - storage_secret_key
    depends_on:
      storage:
        condition: service_healthy
    networks:
      - default
      - smart-construction-net
    restart: "no"

  web:
    image: smart-construction-web:local
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_ASSETS_BASE_URL: /assets
        ASSETS_PROXY_URL: http://storage:8333/${ASSETS_BUCKET:-smart-assets}
        API_PROXY_URL: http://10.0.1.201:8000
    environment:
      API_INTERNAL_URL: http://10.0.1.201:8000
      REGISTRATIONS_UI_ENABLED: ${REGISTRATIONS_UI_ENABLED:-true}
    depends_on:
      storage-init:
        condition: service_completed_successfully
    networks:
      - default
      - smart-construction-net
    init: true
    restart: unless-stopped

  gateway:
    image: nginx:1.28-alpine
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      web:
        condition: service_started
    healthcheck:
      test:
        ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 12
    networks:
      - default
      - smart-construction-net
    restart: unless-stopped

volumes:
  storage-data:

networks:
  smart-construction-net:
    name: smart-construction-net

secrets:
  storage_access_key:
    file: ${SMART_SECRETS_DIR:-./.secrets}/storage/access-key
  storage_secret_key:
    file: ${SMART_SECRETS_DIR:-./.secrets}/storage/secret-key
  storage_admin_password:
    file: ${SMART_SECRETS_DIR:-./.secrets}/storage/admin-password

# front precisa de admin-password, secret-key, access-key
# back precisa de migration-password, api-password, s3-identities.json, s3-admin-password, s3-api-access-key, s3-api-secret-key, s3-bootstrap-access-key, s3-bootstrap-secret-key
# banco precisa de migration-password, api-password

