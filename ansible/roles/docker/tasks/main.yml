---
- name: Instala git e curl
  ansible.builtin.apt:
    name: [git, curl]
    update_cache: true

- name: Baixa o script oficial de instalação do Docker
  ansible.builtin.get_url:
    url: https://get.docker.com
    dest: /tmp/get-docker.sh
    mode: "0755"

- name: Instala o Docker (inclui o plugin compose)
  ansible.builtin.command: sh /tmp/get-docker.sh
  args:
    creates: /usr/bin/docker
