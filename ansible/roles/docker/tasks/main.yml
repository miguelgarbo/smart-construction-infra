- name: Pasta de chaves do apt
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Baixa chave GPG do Docker
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Adiciona repositório oficial do Docker
  ansible.builtin.apt_repository:
    repo: >-
      deb [arch={{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}
      signed-by=/etc/apt/keyrings/docker.asc]
      https://download.docker.com/linux/ubuntu
      {{ ansible_facts['distribution_release'] }} stable
    filename: docker
    state: present
    update_cache: true

- name: Pasta de configuração do Docker
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: "0755"

- name: Configura rotação de logs do Docker, evitando disco cheio
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    mode: "0644"
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "10m", "max-file": "3" }
      }
  notify: Reiniciar docker

- name: Instala Docker
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    lock_timeout: 300

- name: Inicia o Docker
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Arruma permissão do Docker
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true
