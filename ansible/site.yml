# PLAYBOOK: lista de plays, executados de cima para baixo.
- name: Docker nas VMs (app, back e db)
  hosts: all
  become: true
  roles:
    - docker

- name: Prepara a VM da aplicação (config, segredos)
  hosts: app
  become: true
  roles:
    - app

- name: Configura e sobe o banco (usa os segredos gerados na app)
  hosts: db
  become: true
  roles:
    - db

- name: Prepara a VM do back (config, segredos)
  hosts: back
  become: true
  roles:
    - back

# O banco precisa estar de pé antes do back subir (api-migrate conecta no db).
- name: Sobe o backend
  hosts: back
  become: true
  tasks:
    - name: Executa as tasks de deploy da role back
      ansible.builtin.include_role:
        name: back
        tasks_from: deploy

# A aplicação sobe por último, com banco e backend já prontos.
- name: Sobe a aplicação
  hosts: app
  become: true
  tasks:
    - name: Executa as tasks de deploy da role app
      ansible.builtin.include_role:
        name: app
        tasks_from: deploy