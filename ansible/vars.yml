ansible_user: ubuntu
ansible_ssh_private_key_file: ~/.ssh/smart-construction-key.pem

repo_url: https://github.com/Xua1zin/smart-construction.git
repo_version: main
project_dir: /opt/smart-construction

https_enabled: true

# Nginx
http_port: 80
https_port: 443

timezone: America/Sao_Paulo
swap_size: 2G # O build do Next.js estava estourando
compose_wait_timeout: 900

db_host_ip: "{{ hostvars['db1'].ansible_host }}"
app_ip: "{{ hostvars['app1'].ansible_host }}"
app_domain: "{{ app_ip | replace('.', '-') }}.sslip.io"
public_url: "{{ ('https://' ~ app_domain) if (https_enabled | bool) else ('http://' ~ app_ip) }}"
